    <g fill="#E9A23B">
      <circle cx="0" cy="-4.2" r="2.6"/><circle cx="4" cy="-1.3" r="2.6"/><circle cx="2.5" cy="3.4" r="2.6"/>
      <circle cx="-2.5" cy="3.4" r="2.6"/><circle cx="-4" cy="-1.3" r="2.6"/>
    </g>
    <circle r="2.4" fill="#C9761E"/>
  </g>
</svg>
