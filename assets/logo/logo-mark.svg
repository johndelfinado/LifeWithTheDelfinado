<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Life With The Delfinado's mark">
  <!-- vine stem -->
  <path d="M12 58 C 20 46, 28 34, 34 26 S 46 12, 50 8" fill="none" stroke="#4F6B45" stroke-width="2.2" stroke-linecap="round"/>
  <!-- leaves -->
  <path d="M22 44 C 13 43, 9 36, 10 30 C 17 31, 22 37, 22 44 Z" fill="#7E9A6C"/>
  <path d="M30 32 C 31 23, 26 18, 20 17 C 19 24, 23 30, 30 32 Z" fill="#4F6B45"/>
  <path d="M40 19 C 47 19, 52 23, 53 29 C 46 29, 41 25, 40 19 Z" fill="#7E9A6C"/>
